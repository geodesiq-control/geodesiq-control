name: CI

on:
  push:
    branches: [ dev, main ]

  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-source:
    name: Only dev may target main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_BRANCH" != "dev" ]; then
            echo "Pull requests to main must come from dev, not $HEAD_BRANCH."
            exit 1
          fi

  quality:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      # The test group lets ty resolve pytest in tests/.
      - name: Sync environment
        run: uv sync --locked --no-default-groups --group lint --group test

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Check formatting
        run: uv run --no-sync ruff format --check src

      - name: Type check
        run: uv run --no-sync ty check src tests

  coverage:
    name: Tests and coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked --no-default-groups --group test

      - name: Run tests with coverage
        run: uv run --no-sync pytest -q --cov=geodesiq --cov-report=term-missing --cov-report=xml:coverage.xml

      # On the dev -> main PR the job still runs, so the PR gate checks the tests and the coverage threshold, but the
      # results were already uploaded by the push to dev; upload only from pushes.
      - name: Upload coverage to Coveralls
        if: github.event_name == 'push'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura

      - name: Upload coverage to Qlty
        if: github.event_name == 'push'
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage.xml

  docs:
    name: Documentation build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      # As on Read the Docs (.readthedocs.yaml): the API reference is read from src/ without importing geodesiq.
      - name: Sync environment
        run: uv sync --locked --only-group docs

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

  example-notebooks:
    name: Example notebooks
    if: github.event_name == 'pull_request'
    needs: validate-pr-source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked --no-default-groups --group examples

      # Executes the notebook without changing it; a failing cell fails the job.
      - name: Execute landau_zener.ipynb
        env:
          MPLBACKEND: Agg
        run: uv run --no-sync jupyter execute examples/landau_zener.ipynb

  jupyterlite:
    name: JupyterLite site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      # jupyterlite-xeus solves the emscripten-wasm32 kernel environment with micromamba (only the binary is needed).
      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          init-shell: none
          post-cleanup: none

      - name: Put micromamba on the PATH
        run: |
          echo "$HOME/micromamba-bin" >> "$GITHUB_PATH"
          "$HOME/micromamba-bin/micromamba" --version

      - name: Build site
        run: bash jupyterlite/build.sh

      - name: Install Chromium for Playwright
        run: uv run --no-project --with playwright==1.64.1 playwright install --with-deps chromium

      # The smoke test and the fast examples on every push; on the dev -> main PR also the slow ones (several minutes).
      - name: Run notebooks in the browser
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          notebooks="smoke_test.ipynb landau_zener.ipynb four_level.ipynb"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            notebooks="$notebooks dqd_model.ipynb many_body.ipynb"
          fi
          uv run --no-project --with playwright==1.64.1 \
            python jupyterlite/run_notebooks.py --screenshots jupyterlite-screenshots $notebooks

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jupyterlite-screenshots
          path: jupyterlite-screenshots

      - name: Upload site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: jupyterlite/_output

  deploy-jupyterlite:
    name: Deploy JupyterLite site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: jupyterlite
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  compatibility-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    if: github.event_name == 'pull_request'
    needs: validate-pr-source
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-py${{ matrix.python-version }}

      - name: Sync environment
        run: uv sync --locked --no-default-groups --group test

      - name: Run full test suite
        run: uv run --no-sync pytest --no-cov

  build-package:
    name: Build package
    if: github.event_name == 'pull_request'
    needs: validate-pr-source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked --only-group build

      - name: Build distributions
        run: uv run --no-sync python -m build

      - name: Check distributions
        run: uv run --no-sync twine check --strict dist/*

      - name: Create isolated test environment
        run: uv venv .venv-wheel --python 3.14

      - name: Install built wheel
        run: uv pip install --python .venv-wheel/bin/python dist/*.whl

      - name: Smoke test installed wheel
        run: |
          cd /tmp

          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" <<'PY'
          import geodesiq

          print(f"Successfully imported geodesiq from {geodesiq.__file__}")
          PY

  pr-gate:
    name: PR gate
    if: always() && github.event_name == 'pull_request'
    needs: [ validate-pr-source, quality, coverage, docs, example-notebooks, jupyterlite, compatibility-tests,
             build-package ]
    runs-on: ubuntu-latest

    steps:
      - name: Verify all required checks passed
        env:
          SOURCE_RESULT: ${{ needs.validate-pr-source.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          NOTEBOOK_RESULT: ${{ needs.example-notebooks.result }}
          JUPYTERLITE_RESULT: ${{ needs.jupyterlite.result }}
          TEST_RESULT: ${{ needs.compatibility-tests.result }}
          BUILD_RESULT: ${{ needs.build-package.result }}
        run: |
          for result in "$SOURCE_RESULT" "$QUALITY_RESULT" "$COVERAGE_RESULT" "$DOCS_RESULT" "$NOTEBOOK_RESULT" \
                        "$JUPYTERLITE_RESULT" "$TEST_RESULT" "$BUILD_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required PR job did not succeed: $result"
              exit 1
            fi
          done
