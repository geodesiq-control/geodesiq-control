name: CI

on:
  push:
    branches: [ dev, main ]

  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-source:
    name: Only dev may target main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_BRANCH" != "dev" ]; then
            echo "Pull requests to main must come from dev, not $HEAD_BRANCH."
            exit 1
          fi

  quality:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --only-group lint

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

  #      - name: Check formatting
  #        run: uv run ruff format --check .

  quick-test:
    name: Quick tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --only-group test

      - name: Run tests with coverage
        run: uv run pytest -q --cov=geodesiq --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura

  compatibility-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    if: github.event_name == 'pull_request'
    needs: validate-pr-source
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-py${{ matrix.python-version }}

      - name: Sync environment
        run: uv sync --only-group test

      - name: Run full test suite
        run: uv run pytest

  build-package:
    name: Build package
    if: github.event_name == 'pull_request'
    needs: validate-pr-source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --only-group build

      - name: Build distributions
        run: uv run python -m build

      - name: Check distributions
        run: uv run twine check --strict dist/*

      - name: Create isolated test environment
        run: uv venv .venv-wheel --python 3.14

      - name: Install built wheel
        run: uv pip install --python .venv-wheel/bin/python dist/*.whl

      - name: Smoke test installed wheel
        run: |
          cd /tmp

          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" -W error - <<'PY'
          import warnings
          warnings.simplefilter("error")
          warnings.filterwarnings(
              "ignore",
              message="matplotlib not found: Graphics will not work.",
              category=UserWarning,
              module=r"qutip(\..*)?",
          )
          import geodesiq

          print(f"Successfully imported geodesiq from {geodesiq.__file__}")
          PY

  pr-gate:
    name: PR gate
    if: always() && github.event_name == 'pull_request'
    needs: [ validate-pr-source, quality, compatibility-tests, build-package ]
    runs-on: ubuntu-latest

    steps:
      - name: Verify all required checks passed
        env:
          SOURCE_RESULT: ${{ needs.validate-pr-source.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.compatibility-tests.result }}
          BUILD_RESULT: ${{ needs.build-package.result }}
        run: |
          for result in "$SOURCE_RESULT" "$QUALITY_RESULT" "$TEST_RESULT" "$BUILD_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required PR job did not succeed: $result"
              exit 1
            fi
          done
