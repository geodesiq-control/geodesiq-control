name: Release

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]

permissions: { }

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Read version from package
        id: version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          meta_file = pathlib.Path("src/geodesiq/_meta.py")
          content = meta_file.read_text(encoding="utf-8")

          match = re.search(
              r'__version__\s*=\s*["\']([^"\']+)["\']',
              content,
          )

          if not match:
              raise SystemExit(
                  "Could not find __version__ in src/geodesiq/_meta.py"
              )

          version = match.group(1)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
          PY

      - name: Fail if tag already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags origin

          if git ls-remote \
            --exit-code \
            --tags origin \
            "refs/tags/${TAG}" >/dev/null 2>&1
          then
            echo "Tag ${TAG} already exists."
            echo "Bump __version__ before merging to main."
            exit 1
          fi

      - name: Extract release notes from changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]

          changelog = pathlib.Path("CHANGELOG.md").read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n"
              rf"(?P<body>.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )

          match = pattern.search(changelog)

          if not match:
              raise SystemExit(
                  f"Could not find CHANGELOG entry for version {version}"
              )

          notes = match.group("body").strip()

          pathlib.Path("release_notes.md").write_text(
              notes + "\n",
              encoding="utf-8",
          )
          PY

      - name: Sync build environment
        run: uv sync --only-group build

      - name: Build distributions
        run: uv run python -m build

      - name: Check distributions
        run: uv run twine check --strict dist/*

      - name: Create isolated test environment
        run: uv venv .venv-wheel --python 3.14

      - name: Install built wheel
        run: uv pip install --python .venv-wheel/bin/python dist/*.whl

      - name: Smoke test built wheel
        run: |
          cd /tmp

          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" -W error - <<'PY'
          import warnings
          warnings.simplefilter("error")
          warnings.filterwarnings(
              "ignore",
              message="matplotlib not found: Graphics will not work.",
              category=UserWarning,
              module=r"qutip(\..*)?",
          )
          import geodesiq

          print(f"Successfully imported geodesiq from {geodesiq.__file__}")
          PY

      - name: Store distributions for publishing
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file release_notes.md